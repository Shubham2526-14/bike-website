<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangular Hole</title>
    <style>
        body {

            margin: 0;
            /* overflow-x: hidden; */
            /* height: 100vh; */
            /* overflow: hidden; */
        }

        .parent {
            height: 100vh;
            width: 100vw;
            position: relative;

        }

        .mask {
            /* position: fixed; */
            /* Uncomment this to make it cover the entire screen */

            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 1);

            /* Rectangular hole using CSS mask */
            -webkit-mask:
                linear-gradient(black, black),
                /* Fully opaque outer mask */
                linear-gradient(white, white);
            /* Inner rectangle (hole) */
            -webkit-mask-composite: xor;
            -webkit-mask-size: 100%, 300px 200px;
            /* Adjust width (200px) and height (150px) */
            -webkit-mask-position: center;
            -webkit-mask-repeat: no-repeat;

            mask:
                linear-gradient(black, black),
                /* Fully opaque outer mask */
                linear-gradient(white, white);
            mask-composite: exclude;
            mask-size: 100%, 300px 200px;
            mask-position: center;
            mask-repeat: no-repeat;
        }

        
        
        .hero-video {
            height: 100%;
            width: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
        }
        .box {
            height: 100vh;
            width: 100vw;
        }
        </style>
</head>

<body>
    <div class="box">

    </div>

    <div class="parent">
        <video src="./videos/Bike video.mp4" autoplay muted loop class="hero-video"></video>
        <div class="mask">

        </div>
    </div>

    <div class="box">

    </div>




    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
        integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"
        integrity="sha512-P2IDYZfqSwjcSjX0BKeNhwRUH8zRPGlgcWl5n6gBLzdi4Y5/0O4zaXrtO4K9TZK6Hn1BenYpKowuCavNandERg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        gsap.to(".mask", {
            maskSize: "100%, 100vw 100vh",
            scrollTrigger: {
                trigger: ".parent",
                start: "top top",
                end: "",
                pin: true,
                scrub: 1,
            }
        })
    </script>
</body>

</html>
